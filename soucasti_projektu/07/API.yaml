openapi: 3.0.0
info:
  title: ConsoleCloud API
  version: 1.0.0
  description: API pro Zapnutí / Vypnutí pronajaté konzole
paths:
  /actions/toggle_power.php:
    post:
      summary: Zapnutí / Vypnutí pronajaté konzole
      description: Změní stav napájení (power_state) u konkrétního pronájmu uživatele.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id_pronajem:
                  type: integer
                  description: ID aktivního pronájmu
                  example: 12
                new_state:
                  type: integer
                  description: Nový stav konzole (1 = Zapnout, 0 = Vypnout)
                  example: 1
      responses:
        '302':
          description: Úspěšná akce, přesměrování na dashboard
        '401':
          description: Chyba, uživatel není přihlášen
        '500':
          description: Chyba serveru nebo databáze
